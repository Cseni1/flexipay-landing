name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  links:
    name: Check local links and assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check required files
        run: |
          for f in index.html privacy.html terms.html robots.txt sitemap.xml assets/styles.css assets/app.js; do
            test -f "$f" || { echo "Missing $f"; exit 1; }
          done
      - name: Check links (offline)
        uses: lycheeverse/lychee-action@v2
        with:
          # logo.png is optional: the header falls back to a text mark when it is absent.
          args: --offline --no-progress --exclude-path README.md --exclude 'logo\.png$' './**/*.html'
          fail: true
